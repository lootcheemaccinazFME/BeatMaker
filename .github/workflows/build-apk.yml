name: Build DEMONIC OS APK
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DEMONIC-OS-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Publish APK release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "demonic-apk-${{ github.run_number }}" app/build/outputs/apk/debug/*.apk --title "DEMONIC OS APK ${{ github.run_number }}" --notes "Automated DEMONIC OS debug APK build."
