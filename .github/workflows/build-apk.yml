name: Build BeatMaker Basic APK
on:
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build basic debug APK
        run: chmod +x gradlew && ./gradlew clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BeatMaker-basic-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Publish basic APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "beatmaker-basic-${{ github.run_number }}" app/build/outputs/apk/debug/*.apk --title "BeatMaker Basic APK ${{ github.run_number }}" --notes "Basic Android BeatMaker debug APK."
